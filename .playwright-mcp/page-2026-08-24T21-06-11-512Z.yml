    - generic [ref=f40e27]:
      - paragraph [ref=f40e28]: I recently went through a “return to reality” that stung a bit, but one that might turn out to be useful.
      - paragraph [ref=f40e29]: "TLDR: seniority and experience (meaning technical legitimacy) are more or less orthogonal."
      - paragraph [ref=f40e30]: I’m realizing this a bit late, after nearly 4 years working in software engineering. Lack of self-awareness or pride? Doesn’t really matter.
      - paragraph [ref=f40e31]: "The intuition is pretty simple: you can spend 10, 15 years in tech, in software engineering, DevOps, etc. If you’re constantly doing the same thing, not developing or improving your skills, your understanding of systems, of abstractions, etc.; in short, if you’re just showing up without really asking yourself hard questions, then you don’t have 10 years of experience. You have 10 years of tenure."
