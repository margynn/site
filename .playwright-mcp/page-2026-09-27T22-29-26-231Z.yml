    - group [ref=f3e32]:
      - generic "▶ Sommaire" [ref=f3e33] [cursor=pointer]
    - generic [ref=f3e35]:
      - paragraph [ref=f3e36]: Quand, comme moi, on vient du monde du développement Web, et que l’on s’intéresse progressivement au réseau et aux systèmes distribués et décentralisés, on sort du modèle familier client-serveur pour se diriger vers le paradigme du pair-à-pair (abrégé P2P). Et, en abordant ce paradigme on découvre une série de problèmes et de contraintes nouvelles que je voudrais partager ici.
      - group [ref=f3e37]:
        - generic "▶ Un petit meme avant de commencer" [ref=f3e38] [cursor=pointer]
      - separator [ref=f3e39]
      - heading "1. Client-serveur vs P2P" [level=1] [ref=f3e40]
      - paragraph [ref=f3e41]:
        - text: La différence entre le paradigme client-serveur et P2P est plus une
        - strong [ref=f3e42]: distinction topologique que technique
        - text: . On peut généralement utiliser, dans les deux cas, les mêmes protocoles réseau et la même infrastructure. Le bon modèle mental est qu’il s’agit d’une topologie pour les applications sur Internet.
      - paragraph [ref=f3e43]: "Le modèle client-serveur est centralisé. Il suppose deux familles de participants : les clients, qui initient généralement les connexions avec les serveurs, et les serveurs, qui répondent aux communications des clients. Les clients peuvent communiquer entre eux, mais leurs communications sont généralement relayées par le serveur. C’est le modèle le plus répandu sur le Web. Quand un utilisateur ouvre une page Web avec son navigateur, il agit comme un client, qui ouvre une connexion avec un serveur (en l’occurrence le site Web). S’il communique avec d’autres clients, les communications sont généralement relayées par le serveur (par exemple dans des messageries Web comme Discord, WhatsApp ou Slack)."
      - paragraph [ref=f3e44]: "À l’inverse, le P2P est un modèle dans lequel les participants sont des pairs. Chaque pair peut à la fois agir comme client et comme serveur : il peut initier une connexion et accepter des connexions provenant d’autres pairs. C’est particulièrement répandu dans des applications comme les systèmes distribués, les blockchains, BitTorrent ou WebRTC."
      - separator [ref=f3e45]
      - heading "2. Le problème des réseaux privés" [level=1] [ref=f3e46]
      - paragraph [ref=f3e47]: "“Internet est un réseau de réseaux”, et la plupart des utilisateurs se trouvent dans des réseaux privés (eg. réseaux domestique, d’entreprise, LAN, VPN etc…), c’est à dire non-adressable depuis l’Internet public. Je vois deux raisons principales à cela, une sécuritaire et une technique/historique:"
      - heading "Sécurité et isolation" [level=2] [ref=f3e48]
      - paragraph [ref=f3e49]: "L’isolation d’équipements dans des réseaux privés permet d’éviter le trafic entrant, même sans configuration explicite de pare-feu. Par définition, les équipements d’un réseau privé ne sont pas adressables depuis l’Internet public. C’est souhaitable: le jour où mon grille pain connecté accepte une connexion depuis Pékin, je considère que l’architecture réseau a échoué."
      - heading "Épuisement des adresses IPv4" [level=2] [ref=f3e50]
      - paragraph [ref=f3e51]:
        - text: L’Internet Protocol, est le protocole au coeur du routage des données sur Internet. IPv4, version du protocole IP le plus déployé, a été formalisé en 1981 dans la
        - link [ref=f3e52] [cursor=pointer]:
          - /url: https://www.rfc-editor.org/info/rfc791
          - strong [ref=f3e53]: RFC 791
        - text: .
      - paragraph [ref=f3e54]:
        - text: Une adresse IPv4 est encodée sur 32 bits, ça représente une plage de
        - code [ref=f3e55]: 1<<32 = 4_294_967_296
        - text: adresses. C’est-à-dire environ 4 Milliards d’adresses IPv4 routables sur l’Internet public. C’est insuffisant pour attribuer une adresse IPv4 unique à chaque équipement connecté à Internet.
      - alert [ref=f3e56]:
        - generic [ref=f3e57]:
          - text: IPv6 résout ce problème en utilisant des adresses de 128 bits, soit
          - code [ref=f3e58]: 1<<128 ≈ 3,4×10^38
          - text: adresses possibles. Mais le déploiement d’IPv6 étant progressif, IPv4 reste largement utilisé.
      - paragraph [ref=f3e59]:
        - text: La solution à l’épuisement d’adresse IPv4 est décrite dans
        - link [ref=f3e60] [cursor=pointer]:
          - /url: https://www.rfc-editor.org/info/rfc1918
          - strong [ref=f3e61]: RFC 1918
        - text: "et consiste à réutiliser des adresses IPv4 dans des réseaux privés sans se soucier de leur unicité à l’échelle mondiale. En particulier trois plages sont réservées à cet usage:"
      - list [ref=f3e62]:
        - listitem [ref=f3e63]:
          - text: "-"
          - code [ref=f3e64]: 10.0.0.0/8
        - listitem [ref=f3e65]:
          - text: "-"
          - code [ref=f3e66]: 172.16.0.0/12
        - listitem [ref=f3e67]:
          - text: "-"
          - code [ref=f3e68]: 192.168.0.0/16
      - paragraph [ref=f3e69]:
        - text: Toutes les adresses qui appartiennent à ces plages n’ont aucune signification à l’échelle globale, elles ne sont pas routées sur l’Internet public. En conséquence, deux équipements sur des réseaux privés distincts peuvent avoir la même adresse locale.
        - code [ref=f3e70]: ifconfig
        - text: permet de découvrir l’adresse locale de sa machine, ici sur l’interface
        - code [ref=f3e71]: en0
        - text: "de ma machine:"
      - code [ref=f3e74]:
        - generic [ref=f3e75]: $ ifconfig
        - generic [ref=f3e77]: "en0: ..."
        - generic [ref=f3e79]: inet 192.168.1.29 netmask 0xffffff00 broadcast 192.168.1.255
      - paragraph [ref=f3e81]: Cette adresse est routable dans le réseau local. Mais pas dans l’Internet public. Lorsque du trafic sortant est émis depuis le réseau local (eg. se connecter à un site web), le serveur doit connaitre l’adresse source/d’origine pour répondre.
      - paragraph [ref=f3e82]:
        - text: C’est là qu’intervient le
        - strong [ref=f3e83]: Network Address Translation (NAT)
        - text: . Dans le cas classique d’un NAT IPv4, la passerelle du réseau local traduit l’adresse et le port source du paquet pour utiliser son propre couple (IP publique ; port publique). Le port publique choisi pour la traduction dépend du NAT, en principe on ne peut pas vraiment le deviner à l’avance
      - paragraph [ref=f3e84]:
        - text: En pratique, les paquets peuvent traverser
        - strong [ref=f3e85]: plusieurs NAT sur l’infrastructure du fournisseur
        - text: "avant d’atteindre leur destination. À chaque fois qu’une connexion sortante est initiée, la passerelle maintient un mappage entre l’extrémité privée et l’extrémité publique. Chaque paquet envoyé sur cette connexion voit son origine/source traduite à la volée par le NAT. Par exemple :"
      - code [ref=f3e88]:
        - generic [ref=f3e89]: ┌──────────────────┐ ┌─────────────────────┐
        - generic [ref=f3e91]: │ 192.168.1.29 │ │ NAT Gateway │
        - generic [ref=f3e93]: │ port 54321 │ ───> │ 82.67.183.248:39142 │ ───> Destination
        - generic [ref=f3e95]: └──────────────────┘ └─────────────────────┘
      - paragraph [ref=f3e97]:
        - text: Lorsque la réponse revient vers
        - code [ref=f3e98]: 82.67.183.248:39142
        - text: ", la passerelle consulte ce mappage et retransmet le paquet vers"
        - code [ref=f3e99]: 192.168.1.29:54321
        - text: .
      - separator [ref=f3e100]
      - heading "3. Le P2P est différent" [level=1] [ref=f3e101]
      - paragraph [ref=f3e102]: "Dans le modèle client-serveur, le NAT ne pose pas de soucis car le serveur est publiquement routable : il est accessible sur l’Internet public. Une fois que la connexion est initiée par le client (eg. un équipement du réseau privé/local) le NAT enregistre le mappage (IP privée ; port privée) <-> (IP publique ; port publique), le serveur peut ensuite répondre et le NAT effectuer la traduction et transmettre à l’équipement associé du réseau privé."
      - paragraph [ref=f3e103]: Dans le modèle P2P, le NAT pose problème dans le cas où les deux pairs sont chacun derrière un NAT. Aucun des pairs n’est directement accessible car aucun des NAT ne contient le mappage (IP privée ; port privée) <-> (IP publique ; port publique).
      - paragraph [ref=f3e104]: "D’ailleurs les pairs eux-mêmes ne connaissent pas leur (IP publique ; port publique) : cette information est maintenue par leur NAT respectif. Aucun des deux ne peut donc simplement initier une connexion vers l’autre comme il le ferait avec un serveur publiquement adressable."
      - code [ref=f3e107]:
        - generic [ref=f3e108]: Pair A Pair B
        - generic [ref=f3e110]: 192.168.1.10:51000 192.168.2.20:52000
        - generic [ref=f3e112]: │ │
        - generic [ref=f3e114]: │ │
        - generic [ref=f3e116]: │ Adresse publique ? │
        - generic [ref=f3e118]: │ │
        - generic [ref=f3e120]: │ ─────── impossible ─────── │
        - generic [ref=f3e122]: │ │
        - generic [ref=f3e124]: NAT A NAT B
        - generic [ref=f3e126]: │ │
        - generic [ref=f3e128]: └────────────── INTERNET ────────────────┘
      - separator [ref=f3e130]
      - heading "4. Découvrir son adresse publique avec STUN" [level=1] [ref=f3e131]
      - paragraph [ref=f3e132]:
        - text: La première étape pour tenter de traverser le NAT c’est de connaitre la résolution (IP publique ; port publique) effectuée par le NAT. Cette information est nécessaire pour le pair distant pour router ses paquets. La
        - link [ref=f3e133] [cursor=pointer]:
          - /url: https://www.rfc-editor.org/info/rfc8489/
          - strong [ref=f3e134]: RFC 8489
        - text: "définit une suite d’outils pour traverser un NAT. L’abstract indique :"
      - blockquote [ref=f3e135]:
        - paragraph [ref=f3e136]: “Session Traversal Utilities for NAT (STUN) is a protocol that serves as a tool for other protocols in dealing with NAT traversal. It can be used by an endpoint to determine the IP address and port allocated to it by a NAT. "
      - paragraph [ref=f3e137]:
        - text: "Cette RFC définit une seule méthode:"
        - code [ref=f3e138]: Binding
        - text: "(le champ “type de message” du header encode aussi une classe : requête, succès, erreur ou indication, mais un seul type d’échange nous intéresse ici : la requête"
        - code [ref=f3e139]: Binding
        - text: et sa réponse). Ce qui nous intéresse pour la résolution (IP publique ; port publique) du NAT c’est de décoder l’attribut
        - code [ref=f3e140]: XOR-MAPPED-ADDRESS
        - text: de la réponse. Cet attribut contient l’adresse publique du client telle que vue par le serveur STUN, c’est à dire après traduction par le dernier NAT traversé.
      - group [ref=f3e141]:
        - generic "▶ Format binaire des messages STUN" [ref=f3e142] [cursor=pointer]
      - paragraph [ref=f3e143]:
        - text: "Une bonne nouvelle c’est que Google met gratuitement à disposition des serveurs STUN pour les projets WebRTC. Par exemple:"
        - code [ref=f3e144]: stun.l.google.com:19302
        - text: .
      - group [ref=f3e145]:
        - generic "▶ Example Go" [ref=f3e146] [cursor=pointer]
      - paragraph [ref=f3e147]: "En relançant l’exécution plusieurs fois de suite on voit que l’IP reste fixe mais le port change :"
      - code [ref=f3e150]:
        - generic [ref=f3e151]: $ go run .
        - generic [ref=f3e153]: "2026/09/27 23:38:53 NAT: 82.67.x.x:55945"
        - generic [ref=f3e156]: $ go run .
        - generic [ref=f3e158]: "2026/09/27 23:41:21 NAT: 82.67.x.x:57853"
        - generic [ref=f3e161]: $ go run .
        - generic [ref=f3e163]: "2026/09/27 23:41:23 NAT: 82.67.x.x:55655"
      - paragraph [ref=f3e165]: Dans mon cas particulier j’ai une IP fixe auprès de mon FAI, ce qui explique qu’elle ne varie pas d’un run à l’autre ; le port, lui, change car c’est le NAT qui choisit dynamiquement la traduction à chaque nouvelle connexion initiée par le programme Go.
      - alert [ref=f3e166]:
        - generic [ref=f3e167]:
          - text: Cette adresse dépend-elle de la destination contactée ? Pour la plupart des NAT non, le mapping ne dépend que de (IP privée ; port privée). Mais certains NAT (dits
          - strong [ref=f3e168]: symétriques
          - text: ") attribuent une traduction différente par destination : l’adresse vue par le pair serait alors différente. J’y reviens en partie 6."
      - heading "5. UDP hole punching" [level=1] [ref=f3e169]
      - paragraph [ref=f3e170]: ├── principe ├── échange des endpoints └── établissement du chemin direct
      - paragraph [ref=f3e171]:
        - text: "Chaque tentative échoue pour la même raison : un NAT ne laisse entrer un paquet que s’il correspond à une entrée déjà présente dans sa table de mappage, et cette table n’est alimentée que par le"
        - strong [ref=f3e172]: trafic sortant
        - text: de son propre réseau. Quand
        - code [ref=f3e173]: Peer A
        - text: envoie vers
        - code [ref=f3e174]: Peer B
        - text: ", ce paquet sort sans problème de"
        - code [ref=f3e175]: NAT A
        - text: ", mais en arrivant sur"
        - code [ref=f3e176]: NAT B
        - text: ", aucune entrée sortante ne correspond, il est alors rejeté (même sans tenir compte du réglage du pare-feu). Cette situation est symétrique pour"
        - code [ref=f3e177]: Peer B
        - text: qui envoie vers
        - code [ref=f3e178]: Peer A
        - text: .
      - alert [ref=f3e179]:
        - generic [ref=f3e180]: "Résultat : même en connaissant l’adresse publique de l’autre, aucun des deux ne peut initier de connexion en premier, car son paquet sera bloqué par le NAT distant."
