    - generic [ref=f3e26]:
      - time [ref=f3e27]: 27 sept. 2026
      - text: ":: 9 min de lecture (1874 mots)"
    - generic [ref=f3e28]:
      - link "P2P" [ref=f3e29] [cursor=pointer]:
        - /url: /fr/tags/p2p/
      - link "Réseau" [ref=f3e30] [cursor=pointer]:
