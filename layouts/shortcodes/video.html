{{ $id := .Get "id" }}
{{ $platform := .Get "platform" | default "youtube" }}
{{ $title := .Get "title" | default "Video" }}
<div class="video-embed">
  {{ if eq $platform "youtube" }}
    <iframe src="https://www.youtube.com/embed/{{ $id }}" title="{{ $title }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
  {{ else if eq $platform "vimeo" }}
    <iframe src="https://player.vimeo.com/video/{{ $id }}" title="{{ $title }}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
  {{ end }}
</div>
