{{ $type := .Get "type" | default "info" }}
{{ $title := .Get "title" }}
<div class="alert alert--{{ $type }}" role="alert">
  <div class="alert__icon">
    {{ if eq $type "info" }}ℹ{{ else if eq $type "warning" }}⚠{{ else if eq $type "success" }}✓{{ else if eq $type "danger" }}✕{{ else if eq $type "note" }}✎{{ end }}
  </div>
  <div class="alert__body">
    {{ with $title }}<div class="alert__title">{{ . }}</div>{{ end }}
    <div class="alert__content">{{ .Inner | markdownify }}</div>
  </div>
</div>
